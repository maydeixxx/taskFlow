spring:
  application:
    name: gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: userService
            uri: lb://userService
            predicates:
              - Path=/all_users, /save_user, /user_id/**, /delete_user/**, /update_user/**, /user_role/** ,/add_project/**

          - id: projectService
            uri: lb://projectService
            predicates:
              - Path=/all_projects, /update_project/**, /project_id/**, /delete_project/**, /save_project

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 9090
